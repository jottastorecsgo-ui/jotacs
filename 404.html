<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada · Jota Store</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A121C">
<link rel="icon" type="image/webp" href="/assets/img/shared/jota_lobo_128.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Russo+One&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A121C;
    --panel: #101E2C;
    --border: rgba(255,255,255,0.08);
    --celeste: #2FB6E8;
    --gold: #E8B93C;
    --text: #F2F7FA;
    --muted: #A9BCC9;
    --font-display: 'Russo One', sans-serif;
    --font-body: 'Rajdhani', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
  main{max-width:460px;width:100%;text-align:center;background:var(--panel);border:1px solid var(--border);padding:36px 24px}
  img{width:88px;height:88px;margin-bottom:18px}
  .codigo{font-family:var(--font-display);font-size:56px;line-height:1;color:var(--celeste);letter-spacing:2px}
  h1{font-family:var(--font-display);font-size:20px;font-weight:400;margin:12px 0 8px}
  p{color:var(--muted);font-size:17px;line-height:1.45;margin-bottom:24px}
  .botones{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  a{font-family:var(--font-display);font-size:14px;text-decoration:none;padding:12px 18px;border:1px solid var(--border);color:var(--text)}
  a.principal{background:var(--celeste);border-color:var(--celeste);color:#05111b}
  a:hover{border-color:var(--gold)}
  a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main>
  <img src="/assets/img/shared/jota_lobo_128.webp" alt="" width="88" height="88">
  <div class="codigo">404</div>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté mal escrito o que la página ya no esté. Desde acá podés volver a la tienda.</p>
  <div class="botones">
    <a class="principal" href="/comprar.html">Ir a la tienda</a>
    <a href="/index.html">Inicio</a>
  </div>
</main>
</body>
</html>
